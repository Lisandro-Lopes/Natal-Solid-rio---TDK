</style></head><body><div id="app"></div><div id="t" aria-live="polite"></div><div id="m"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K='cnt-v1',ST={disponivel:'Disponível',apadrinhada:'Apadrinhada',recebido:'Recebido pelo RH',conferido:'Conferido',entregue:'Entregue à instituição',pendente:'Pendência',cancelado:'Cancelado'},FLOW=['disponivel','apadrinhada','recebido','conferido','entregue'];
const CAT={crianca:'Criança',adolescente:'Adolescente',idoso:'Pessoa idosa'};
const USERS={admin:{id:'u1',name:'Ana Demo (RH)',role:'admin',l:'Administrador/RH'},func:{id:'u2',name:'Bruno Demo',role:'func',l:'Funcionário'},vol:{id:'u3',name:'Carla Demo',role:'vol',l:'Organizador/Voluntário'}};
const IC={home:'M3 11l9-8 9 8M5 10v10h14V10',mail:'M3 5h18v14H3zM3 6l9 7 9-7',gift:'M3 8h18v4H3zM5 12v9h14v-9M12 8v13',heart:'M12 21s-8-5-8-11a4.5 4.5 0 018-3 4.5 4.5 0 018 3c0 6-8 11-8 11z',users:'M16 20v-2a4 4 0 00-8 0v2M12 12a3.5 3.5 0 100-7 3.5 3.5 0 000 7z',cal:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',info:'M12 3a9 9 0 100 18 9 9 0 000-18zM12 11v6M12 7.5v.5',out:'M9 4H4v16h5M16 8l4 4-4 4M20 12H9'};
const ic=n=>`<svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="${IC[n]}"/></svg>`;
let S,me=null,F={q:'',cat:'',st:'',ord:'code'};
const today=()=>new Date().toLocaleDateString('pt-BR');
function seed(){const W=[['Kit de desenho e lápis de cor','Bola de futebol','Boneca de pano','Quebra-cabeça 200 peças','Tênis tamanho 30','Mochila escolar','Jogo de tabuleiro','Carrinho de controle remoto'],['Fone de ouvido','Camiseta de time','Livro de aventura','Tênis tamanho 38','Relógio simples','Kit de maquiagem básica'],['Kit de higiene pessoal','Xale de lã','Chinelo confortável','Meias térmicas','Caixa de chocolates','Agasalho']];
const ST0=['disponivel','disponivel','apadrinhada','recebido','conferido','entregue','disponivel','pendente'],cards=[];
for(let i=0;i<24;i++){const k=i<10?0:i<17?1:2,cat=['crianca','adolescente','idoso'][k],st=ST0[i%8],w=W[k][i%W[k].length];
cards.push({id:i+1,camp:1,code:'NS26-'+'CAI'[k]+String(i+1).padStart(3,'0'),cat,age:k==2?'60+ anos':k==1?'12–18 anos':i%2?'6–11 anos':'0–5 anos',wish:w,status:st,sp:st=='disponivel'?null:(i==2?'u2':'e'+(i%5+1)),spn:st=='disponivel'?null:(i==2?'Bruno Demo':'Funcionário Demo '+(i%5+1))})}
return{camp:{id:1,name:'Natal Solidário 2026 (demonstração)',year:2026,open:true},hist:[{y:2024,total:70,sp:52},{y:2025,total:78,sp:66}],cfg:{cancelOk:true},cards,
opps:[[1,'Organização das cartinhas','Catalogar cartinhas com códigos anônimos.'],[2,'Conferência dos presentes','Conferir presentes recebidos pelo RH.'],[3,'Separação dos kits','Montar kits de higiene pessoal.'],[4,'Apoio na logística','Organizar o fluxo de entrega ao RH.'],[5,'Preparação das ações','Apoiar atividades autorizadas pelo RH.']].map(o=>({id:o[0],t:o[1],d:o[2]})),
apps:[{o:2,u:'e3',n:'Funcionário Demo 3',st:'aprovado',task:'Conferir presentes na semana de recebimento'},{o:3,u:'e4',n:'Funcionário Demo 4',st:'pendente',task:''},{o:1,u:'u3',n:'Carla Demo',st:'aprovado',task:'Catalogar as cartinhas novas'}],
dates:[['abertura','Abertura da campanha'],['cartinhas','Disponibilização das cartinhas'],['prazo','Prazo de apadrinhamento'],['entrega','Data limite para entrega de presentes'],['conf','Conferência das doações'],['inst','Entrega às instituições'],['fim','Encerramento da campanha']].map(d=>({k:d[0],l:d[1],v:''})),
log:[{t:'—',u:'Sistema',m:'Dados de demonstração carregados (fictícios)'}]}}
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S||seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const log=m=>{S.log.unshift({t:new Date().toLocaleString('pt-BR'),u:me.name,m});S.log=S.log.slice(0,100)};
const need=(...r)=>{if(!me||!r.includes(me.role))throw Error('Sem permissão para esta ação.')};
const cs=()=>S.cards.filter(c=>c.camp===S.camp.id),cnt=(a,s)=>a.filter(c=>s.includes(c.status)).length,find=id=>S.cards.find(c=>c.id===id);
function toast(m,e){const d=document.createElement('div');d.className='tt'+(e?' e':'');d.textContent=m;$('#t').append(d);setTimeout(()=>d.remove(),3800)}
const A=f=>{try{f();save();render()}catch(e){toast(e.message,1)}};
function ask(t,b,ok,f){$('#m').innerHTML=`<div class="ov" onclick="if(event.target==this)cl()"><div class="md" role="dialog" aria-modal="true" aria-label="${esc(t)}"><h2>${esc(t)}</h2><div>${b}</div><p style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn o" onclick="cl()">Cancelar</button>${ok?`<button class="btn" id="ok">${ok}</button>`:''}</p></div></div>`;if(ok)$('#ok').onclick=()=>{cl();A(f)};($('#ok')||$('.btn')).focus()}
const cl=()=>$('#m').innerHTML='';
// ---- regras de negócio (camada de domínio; em produção ficariam no servidor) ----
function sponsor(id){need('func','admin');const c=find(id);if(!S.camp.open)throw Error('Campanha encerrada.');if(!c||c.status!=='disponivel')throw Error('Esta cartinha já foi apadrinhada por outra pessoa.');Object.assign(c,{status:'apadrinhada',sp:me.id,spn:me.name,at:today()});log('Apadrinhou '+c.code);toast('Obrigado por fazer parte dessa corrente de solidariedade! 🎄')}
function unsponsor(id){need('func','admin');const c=find(id);if(!S.cfg.cancelOk)throw Error('O RH não permite cancelamentos nesta campanha.');if(c.sp!==me.id||c.status!=='apadrinhada')throw Error('Só é possível cancelar apadrinhamentos próprios ainda não recebidos pelo RH.');Object.assign(c,{status:'disponivel',sp:null,spn:null});log('Cancelou apadrinhamento de '+c.code);toast('Apadrinhamento cancelado. A cartinha voltou ao catálogo.')}
function setSt(id,s){need('admin');const c=find(id),i=FLOW.indexOf(c.status),j=FLOW.indexOf(s);if(!ST[s])throw Error('Status inválido.');if(s!=='pendente'&&s!=='cancelado'&&j!==i+1)throw Error('Siga o fluxo: cada etapa depende da anterior.');if(s==='cancelado'&&c.status==='entregue')throw Error('Presente já entregue.');c.status=s;c[s+'At']=today();log(`${c.code} → ${ST[s]}`);toast('Status atualizado: '+ST[s])}
function addCard(){need('admin');const f=$('#nc'),w=f.w.value.trim();if(w.length<5)throw Error('Descreva o pedido (mínimo 5 caracteres).');if(/rua |avenida |\d{5}-?\d{3}|casa[- ]lar/i.test(w))throw Error('Não inclua endereços, locais ou dados identificáveis.');const cat=f.cat.value,a=cs(),n=a.filter(c=>c.cat===cat).length+1;
S.cards.push({id:Math.max(...S.cards.map(c=>c.id))+1,camp:S.camp.id,code:'NS'+String(S.camp.year).slice(2)+'-'+'CAI'[['crianca','adolescente','idoso'].indexOf(cat)]+String(S.cards.length+1).padStart(3,'0'),cat,age:f.age.value.trim()||'—',wish:w,status:'disponivel',sp:null,spn:null});log('Cadastrou cartinha');toast('Cartinha cadastrada.');f.w.value=''}
function newCamp(){need('admin');const n=$('#cn').value.trim(),y=+$('#cy').value;if(n.length<3||!(y>=2020&&y<=2100))throw Error('Informe nome (mín. 3 letras) e ano válido.');const a=cs();S.hist.push({y:S.camp.year,total:a.length,sp:a.length-cnt(a,['disponivel'])});S.camp={id:S.camp.id+1,name:n,year:y,open:true};S.dates.forEach(d=>d.v='');log('Criou campanha '+n);toast('Campanha criada e ativa.')}
function interest(o){need('func');if(S.apps.some(a=>a.o===o&&a.u===me.id))throw Error('Você já manifestou interesse.');S.apps.push({o,u:me.id,n:me.name,st:'pendente',task:''});log('Interesse em voluntariado #'+o);toast('Interesse registrado! O RH entrará em contato.')}
function appSt(i,s){need('admin');S.apps[i].st=s;S.apps[i].task=$('#tk'+i)?.value||S.apps[i].task;log(`Voluntário ${S.apps[i].n}: ${s}`);toast('Atualizado.')}
function csv(){need('admin');const r=[['codigo','categoria','faixa','pedido','status','padrinho(interno)']].concat(cs().map(c=>[c.code,CAT[c.cat],c.age,c.wish,ST[c.status],c.spn||'']));log('Exportou CSV');const t=r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');ask('Exportação CSV','<p class="sub">Copie o conteúdo e cole em uma planilha (o download direto não é possível nesta página publicada).</p><textarea readonly rows="8" onfocus="this.select()">'+esc(t)+'</textarea>')}
// ---- views ----
const bar=(l,v,m,c='var(--bb)')=>`<div class="br"><span>${l}</span><i><b style="width:${m?v/m*100:0}%;background:${c}"></b></i><em>${v}</em></div>`;
const pill=s=>`<span class="pill" data-s="${s}">${ST[s]}</span>`,date=k=>{const v=S.dates.find(d=>d.k===k).v;return v?v.split('-').reverse().join('/'):'a definir pelo RH'};
const V={};
V.dash=()=>{const a=cs(),tot=a.filter(c=>c.status!=='cancelado').length,av=cnt(a,['disponivel']),sp=tot-av,rec=cnt(a,['recebido','conferido','entregue']),de=cnt(a,['entregue']),pa=new Set(a.filter(c=>c.sp&&c.status!=='cancelado').map(c=>c.sp)).size,vo=S.apps.filter(x=>x.st==='aprovado').length,pr=tot?Math.round(de/tot*100):0,mx=Math.max(1,...Object.keys(ST).map(s=>cnt(a,[s])));
const ev=S.hist.concat([{y:S.camp.year+' (atual)',total:a.length,sp:sp}]),em=Math.max(1,...ev.map(e=>e.total));
return`<h1>Olá, ${esc(me.name.split(' ')[0])}! 👋</h1><p class="sub">${esc(S.camp.name)} · ${S.camp.open?'campanha aberta':'campanha encerrada'}</p>
<div class="hero"><b style="font-size:18px">Cada gesto conta. Juntos, podemos transformar o Natal de muitas pessoas.</b><br>Taxa de apadrinhamento: ${tot?Math.round(sp/tot*100):0}% · Progresso geral (entregues): ${pr}%</div>
<span class="demo">Dados de demonstração — fictícios</span>
<div class="g g4">${[['Cartinhas disponíveis',av],['Apadrinhadas',sp],['Presentes recebidos',rec],['Presentes entregues',de],['Funcionários participantes',pa],['Voluntários inscritos',S.apps.length+' ('+vo+' aprov.)']].map(k=>`<div class="c k"><b>${k[1]}</b><span>${k[0]}</span></div>`).join('')}</div>
<div class="g g2" style="margin-top:14px"><div class="c"><h2>Progresso geral</h2><div class="br" style="grid-template-columns:1fr"><i style="height:16px"><b style="width:${pr}%;background:var(--bb)"></b></i></div><p class="sub">${de} de ${tot} presentes entregues</p><h2>Situação das cartinhas</h2>${Object.keys(ST).map(s=>bar(ST[s],cnt(a,[s]),mx)).join('')}</div>
<div class="c"><h2>Evolução das campanhas</h2><div class="cols">${ev.map(e=>`<div><b style="height:${e.total/em*100}px"></b>${e.total}<br><small>${e.y}</small></div>`).join('')}</div><h2 style="margin-top:18px">Atividades recentes</h2>${S.log.slice(0,6).map(l=>`<div style="font-size:13px;margin:5px 0"><b>${esc(l.u)}</b> — ${esc(l.m)}<br><small style="color:var(--mu)">${l.t}</small></div>`).join('')}</div></div>`};
V.cartas=()=>`<h1>Cartinhas</h1><p class="sub">Códigos anônimos — nenhuma informação pessoal ou de localização é exibida.</p><span class="demo">Pedidos fictícios de demonstração</span>

V.meus=()=>{const a=cs().filter(c=>c.sp===me.id&&c.status!=='disponivel');return`<h1>Meus apadrinhamentos</h1><p class="sub">Obrigado por levar o Natal a alguém! 💙 Sua participação faz toda a diferença.</p>

V.presentes=()=>{need('admin');const a=cs();return`<h1>Gestão de presentes</h1><p class="sub">Fluxo: Disponível → Apadrinhada → Recebido → Conferido → Entregue. A entrega só é registrada manualmente pelo RH.</p><span class="demo">Dados fictícios</span><div class="c sc"><table><tr><th>Código</th><th>Pedido</th><th>Padrinho (interno)</th><th>Situação</th><th>Ações</th></tr>${a.map(c=>{const n=FLOW[FLOW.indexOf(c.status)+1],ac=c.status!=='disponivel'&&c.status!=='cancelado';return`<tr><td><b>${c.code}</b></td><td>${esc(c.wish)}</td><td>${esc(c.spn||'—')}</td><td>${pill(c.status)}</td><td>${ac&&c.status!=='entregue'?`<button class="btn s" onclick="ask('${n=='entregue'?'Confirmar entrega':'Atualizar status'}','${c.code} → <b>${ST[n]||''}</b>','Confirmo',()=>setSt(${c.id},'${n=='apadrinhada'?'recebido':n}'))">${c.status==='pendente'?'Retomar':'→ '+ST[c.status=='apadrinhada'?'recebido':n]}</button> <button class="btn o s" onclick="A(()=>setSt(${c.id},'pendente'))">Pendência</button> <button class="btn d s" onclick="ask('Cancelar presente','Registrar cancelamento de ${c.code}?','Cancelar presente',()=>setSt(${c.id},'cancelado'))">✕</button>`:'—'}</td></tr>`}).join('')}</table></div>`};
V.vol=()=>{const mine=S.apps.filter(a=>a.u===me.id);

V.cal=()=>`<h1>Calendário da campanha</h1><p class="sub">${me.role==='admin'?'Defina as datas de cada etapa.':'Datas definidas pelo RH.'} Nenhuma data é pré-definida pela TDK.</p><div class="c">${S.dates.map(d=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)"><span>📌 ${d.l}</span>${me.role==='admin'?`<input type="date" style="width:170px" aria-label="${d.l}" value="${d.v}" onchange="A(()=>{need('admin');S.dates.find(x=>x.k=='${d.k}').v=this.value;log('Alterou data: ${d.l}')})">`:`<b>${date(d.k)}</b>`}</div>`).join('')}</div>`;
V.admin=()=>{need('admin');return`<h1>Painel do RH</h1><p class="sub">Campanha ativa: <b>${esc(S.camp.name)}</b> (${S.camp.open?'aberta':'encerrada'})</p><div class="g g2">
<div class="c"><h2>Nova campanha</h2><label for="cn">Nome</label><input id="cn" placeholder="Natal Solidário 2027"><label for="cy">Ano</label><input id="cy" type="number" value="${S.camp.year+1}"><p><button class="btn" onclick="A(newCamp)">Criar campanha</button> ${S.camp.open?`<button class="btn d" onclick="ask('Encerrar campanha','Novos apadrinhamentos serão bloqueados.','Encerrar',()=>{need('admin');S.camp.open=false;log('Encerrou campanha')})">Encerrar</button>`:''}</p></div>
<form class="c" id="nc" onsubmit="return false"><h2>Cadastrar cartinha</h2><label for="ct">Categoria</label><select id="ct" name="cat">${Object.entries(CAT).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><label for="ag">Faixa etária</label><input id="ag" name="age" placeholder="6–11 anos"><label for="w">Pedido ou sugestão</label><input id="w" name="w" placeholder="Ex.: Kit de pintura"><p><button class="btn" onclick="A(addCard)">Cadastrar</button></p></form>
<div class="c"><h2>Configurações e relatórios</h2><label><input type="checkbox" style="width:auto" ${S.cfg.cancelOk?'checked':''} onchange="A(()=>{need('admin');S.cfg.cancelOk=this.checked;log('Alterou regra de cancelamento')})"> Permitir cancelamento de apadrinhamento pelo funcionário</label><p><button class="btn o" onclick="A(csv)">Exportar cartinhas (CSV)</button> <button class="btn o" onclick="ask('Restaurar demonstração','Apaga os dados locais e recarrega os dados fictícios.','Restaurar',()=>{S=seed();log('Demo restaurada')})">Restaurar demo</button></p></div>
<div class="c"><h2>Histórico de campanhas</h2>${S.hist.map(h=>`<div>${h.y} — ${h.total} cartinhas, ${h.sp} apadrinhadas <small>(demo)</small></div>`).join('')}</div></div>
<h2 style="margin-top:20px">Registro de alterações</h2><div class="c sc"><table><tr><th>Quando</th><th>Quem</th><th>Ação</th></tr>${S.log.slice(0,15).map(l=>`<tr><td>${l.t}</td><td>${esc(l.u)}</td><td>${esc(l.m)}</td></tr>`).join('')}</table></div>`};
V.sobre=()=>`<h1>Sobre o projeto</h1><p class="sub">Natal Solidário TDK Gravataí</p><div class="c"><p>O Natal Solidário, coordenado pelo RH, incentiva a solidariedade, o voluntariado e a integração entre a empresa e a comunidade de Gravataí. Crianças, adolescentes e pessoas idosas acolhidos em instituições parceiras escrevem seus desejos; funcionários apadrinham as cartinhas e os presentes são entregues ao RH, que confere e encaminha tudo com sigilo e segurança, em parceria com a Prefeitura.</p><p><b>Como participar:</b> escolha uma cartinha, entregue o presente ao RH no prazo ou inscreva-se como voluntário.</p></div><h2 style="margin-top:20px">Perguntas frequentes</h2><div class="c"><details><summary>Posso conhecer a criança ou a instituição?</summary><p>Não. Para proteger os beneficiários (LGPD), as cartinhas têm código anônimo e a entrega é mediada pelo RH e pela assistente social.</p></details><details><summary>Posso cancelar meu apadrinhamento?</summary><p>Sim, enquanto o RH permitir e o presente ainda não tiver sido recebido.</p></details><details><summary>Onde entrego o presente?</summary><p>Diretamente ao RH, identificando o código da cartinha, até a data limite do calendário.</p></details><details><summary>Preciso de ajuda para participar?</summary><p>Procure o RH ou inscreva-se como voluntário na aba Voluntariado.</p></details></div>`;
const NAV={admin:[['dash','Painel','home'],['cartas','Cartinhas','mail'],['presentes','Presentes','gift'],['vol','Voluntários','users'],['cal','Calendário','cal'],['admin','Administração','shield'],['sobre','Sobre','info']],func:[['dash','Início','home'],['cartas','Cartinhas','mail'],['meus','Meus apadrinhamentos','heart'],['vol','Voluntariado','users'],['cal','Calendário','cal'],['sobre','Sobre','info']],vol:[['vol','Minhas tarefas','users'],['cal','Calendário','cal'],['sobre','Sobre','info']]};
function login(){$('#app').innerHTML=`<div class="lg"><div class="c"><div class="logo" style="padding:0">TDK<small>Logo oficial: substituir por tdk-logo.svg</small></div><h1 style="margin-top:14px">Conecta Natal</h1><p class="sub">Solidariedade que conecta pessoas</p><label for="us">Conta de demonstração</label><select id="us">${Object.entries(USERS).map(([k,u])=>`<option value="${k}">${u.l} — ${u.name}</option>`).join('')}</select><label for="pw">Senha</label><input id="pw" type="password" disabled placeholder="Não utilizada na demonstração"><p><button class="btn" style="width:100%" onclick="me=USERS[$('#us').value];log('Entrou no sistema');location.hash='';render()">Entrar</button></p><small style="color:var(--mu)">Contas fictícias. Em produção: autenticação corporativa (SSO) no servidor.</small><p class="foot" style="margin-top:14px">Protótipo acadêmico demonstrativo — não é um sistema oficial implantado pela TDK.</p></div></div>`}
function render(){if(!me)return login();const nav=NAV[me.role],r=location.hash.slice(1),k=nav.some(n=>n[0]===r)?r:nav[0][0];

const LM={'AA0000':'admin','BB1111':'func','BB2222':'vol'},PH='1753f058549666d0285df57e2ffa1e6875b74e80f8a44bbc043a3b41e964eea0';let tries=0;
const tr=a=>{const R=Math.max(1,Math.ceil(Math.sqrt(a.length))),B=24*R+20,H=50+R*26,cx=B+10;let i=0,d='';for(let r=0;r<R;r++){const k=Math.min(2*r+1,a.length-i);for(let j=0;j<k;j++,i++){const on=a[i].status!=='disponivel'&&a[i].status!=='cancelado';d+=`<circle cx="${cx+(j-(k-1)/2)*24}" cy="${48+r*26}" r="7" fill="${on?['#c8102e','#e8b84a','#fff'][i%3]:'none'}" stroke="${on?'none':'#ffffff99'}" stroke-width="1.5"/>`}}return`<svg viewBox="0 0 ${2*B+20} ${H+30}" style="width:190px;max-width:100%" role="img" aria-label="Árvore da solidariedade: cada bolinha acesa é uma cartinha apadrinhada"><polygon points="${cx},18 ${cx-B},${H} ${cx+B},${H}" fill="#1f6b46"/><rect x="${cx-8}" y="${H}" width="16" height="16" fill="#6b4a2b"/><text x="${cx}" y="24" text-anchor="middle" font-size="22">⭐</text>${d}</svg>`};
function login(){$('#app').innerHTML=`<div class="lights" aria-hidden="true"></div><div class="lg"><div class="c" style="text-align:center"><div class="fam" style="justify-content:center;border-radius:14px;padding:12px">${tr(S.cards)}</div><div class="logo" style="padding:14px 0 0">TDK<small>Logo oficial: substituir por tdk-logo.svg</small></div><h1>Conecta Natal</h1><p class="sub">Solidariedade que conecta pessoas 🎄</p><form onsubmit="doLogin();return false" style="text-align:left"><label for="un">Usuário corporativo (formato AA0000)</label><input id="un" autocomplete="username" placeholder="AA0000" maxlength="6" pattern="[A-Za-z]{2}[0-9]{4}" title="2 letras e 4 números, ex.: AA0000" style="text-transform:uppercase" required><label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password" required><p id="er" role="alert" style="color:var(--er);min-height:20px;margin:6px 0"></p><button class="btn" style="width:100%">Entrar</button></form><details style="text-align:left;margin-top:14px"><summary>Credenciais fictícias de demonstração</summary><p style="font-size:13px">RH: <b>AA0000</b><br>Colaborador (apadrinha e se voluntaria): <b>BB1111</b><br>Organizador/Voluntário (só tarefas): <b>BB2222</b><br>Senha de todos: <b>Natal@2026</b></p></details><p class="foot">Protótipo acadêmico demonstrativo — não é um sistema oficial implantado pela TDK. A verificação roda no navegador e não é segurança real: em produção, usar o login corporativo (SSO/Active Directory) validado no servidor.</p></div></div>`}
async function doLogin(){const u=$('#un').value.trim().toUpperCase(),p=$('#pw').value,e=$('#er');if(tries>=5){e.textContent='Muitas tentativas. Recarregue a página para tentar de novo.';return}try{const h=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p)))].map(b=>b.toString(16).padStart(2,'0')).join('');if(!LM[u]||h!==PH){tries++;e.textContent='Usuário ou senha inválidos.';return}}catch(x){e.textContent='Navegador sem suporte a verificação segura.';return}me=USERS[LM[u]];log('Entrou no sistema');location.hash='';render()}

<div class="g g3"><div class="c k"><b>${mine.length}</b><span>cartinhas apadrinhadas por você 💝</span></div><div class="c k"><b>${pa}</b><span>colegas participando desta corrente 🎄</span></div><div class="c k"><b>${date('entrega')}</b><span>data limite de entrega ao RH 🎁</span></div></div>
<h2 style="margin-top:20px">Como participar</h2><div class="g g3">${[['1','Escolha','Veja as cartinhas anônimas e apadrinhe uma.'],['2','Presenteie','Compre o presente pedido e embrulhe com carinho.'],['3','Entregue ao RH','O RH confere e encaminha com segurança e sigilo.']].map(s=>`<div class="c gr"><b style="font-size:22px">${s[0]}</b> <b>${s[1]}</b><br>${s[2]}</div>`).join('')}</div>
<h2 style="margin-top:20px">Mural de gratidão 💌</h2><div class="g g3">${['Obrigado a cada colega que abriu o coração este ano. — RH (exemplo)','Quem participa ajuda a fazer um Natal mais caloroso na nossa comunidade. — RH (exemplo)','Juntos somos mais fortes. Feliz Natal, família TDK! — RH (exemplo)'].map(m=>`<div class="c gr">${m}</div>`).join('')}</div>`};
const rhExtra=()=>{const a=cs(),ap=a.filter(c=>c.status!=='cancelado'),sp=ap.filter(c=>c.status!=='disponivel'),fn=[['Cadastradas',ap.length],['Apadrinhadas',sp.length],['Recebidas',cnt(ap,['recebido','conferido','entregue'])],['Conferidas',cnt(ap,['conferido','entregue'])],['Entregues',cnt(ap,['entregue'])]],al=[[cnt(a,['pendente']),'com pendência','presentes']],aw=[[cnt(a,['apadrinhada']),'aguardando entrega ao RH'],[cnt(a,['recebido']),'aguardando conferência'],[cnt(a,['conferido']),'prontas para entrega à instituição'],[cnt(a,['pendente']),'com pendência registrada']];
